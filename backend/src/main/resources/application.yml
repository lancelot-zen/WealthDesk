server:
  port: 8080

spring:
  application:
    name: wealthdesk

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/wealthdesk
    username: wealthdesk
    password: wealthdesk123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # MongoDB
  data:
    mongodb:
      uri: mongodb://wealthdesk:wealthdesk123@localhost:27017/wealthdesk?authSource=admin
    redis:
      host: localhost
      port: 6379
      password: wealthdesk123
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

  # Cache
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false

# JWT
app:
  jwt:
    secret: WealthDeskSuperSecretKeyForJWTTokenGeneration2024!@#$%^&*()
    expiration-ms: 86400000

# Logging
logging:
  level:
    com.wealthdesk: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha