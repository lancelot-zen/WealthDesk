version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: wealthdesk-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: wealthdesk
      POSTGRES_USER: wealthdesk
      POSTGRES_PASSWORD: wealthdesk123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthdesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    container_name: wealthdesk-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: wealthdesk
      MONGO_INITDB_ROOT_PASSWORD: wealthdesk123
      MONGO_INITDB_DATABASE: wealthdesk
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wealthdesk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass wealthdesk123
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "wealthdesk123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongo_data:
  redis_data: